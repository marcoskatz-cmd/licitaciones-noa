<!DOCTYPE html>
<html lang="es">
<head>
<script src="https://app.ingecosa.com.ar/guard.js" data-modulo="LICITACIONES"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitaciones viales NOA — INGECO</title>
<meta name="theme-color" content="#f5f4f0">
<style>:root{--azul:#1e3a8a;--azul-claro:#2b4fb3;--azul-suave:#e6ecfb;--tinta:#0f1a3d;--teal:#0e8a7a;--teal-suave:#dcf1ee;--ambar:#d98f00;--ambar-suave:#fff1cf;--ambar-texto:#8a5a00;--alerta:#b8410e;--alerta-suave:#fbe6dc;--fondo:#f5f4f0;--fondo-2:#ebe9e3;--superficie:#fff;--texto:#171c2e;--texto-2:#5b6274;--texto-3:#8a90a0;--linea:#e2dfd7;--linea-fuerte:#c9c5bb;--radio:14px;--radio-s:10px;--barra-h:56px;--cuerpo:system-ui,sans-serif;--display:system-ui,sans-serif}[data-ig-volver]{display:none}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://app.ingecosa.com.ar/ingeco.css">
<script src="https://app.ingecosa.com.ar/ingeco.js" defer></script>
<style>
  :root{
    /* Alias de los nombres de este sistema hacia el estilo común (ingeco.css) */
    --surface-0:var(--fondo);
    --surface-1:var(--superficie);
    --border:var(--linea-fuerte);
    --border-soft:var(--linea);
    --text-primary:var(--texto);
    --text-secondary:var(--texto-2);
    --text-muted:var(--texto-3);
    --accent:var(--azul);
    --good:var(--teal);
    --warning:var(--ambar-texto);
    --serious:var(--alerta);
    --critical:var(--alerta);
    --rel-alta:var(--azul);
    --rel-media:var(--azul-claro);
    --rel-baja:color-mix(in srgb,var(--azul) 22%,white);
    --chip-bg:var(--superficie);
  }

  body{margin:0;font-family:var(--cuerpo);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 18px 64px}

  /* ---- barra superior (como la App INGECO) ---- */
  header.barra{
    position:sticky;top:0;z-index:10;min-height:var(--barra-h);
    display:flex;align-items:center;gap:6px;padding:0 16px 0 8px;
    background:color-mix(in srgb,var(--fondo) 88%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--linea);
  }
  .barra .marca{display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding-left:4px}
  .barra .marca img{height:18px;width:auto;display:block;flex:none}
  h1{font-family:var(--display);font-size:1.25rem;font-weight:600;margin:0;color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{color:var(--text-secondary);font-size:14px;margin:0 0 18px;max-width:70ch}
  .updated{font-size:12.5px;color:var(--text-muted);white-space:nowrap}

  /* ---- KPI ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
  .tile{background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radio);padding:14px 16px}
  .tile .n{font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--tinta);line-height:1.15;font-variant-numeric:tabular-nums}
  .tile .l{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
  .tile.urgente .n{color:var(--alerta)}

  /* ---- filtros ---- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .filters select,.filters input[type=search]{font-size:14px;min-height:42px;padding:8px 12px}
  input[type=search]{min-width:210px;flex:1 1 210px}
  .filters select{max-width:100%;min-width:0}
  .btn{
    font-size:14px;font-weight:600;min-height:42px;padding:0 16px;border-radius:var(--radio-s);cursor:pointer;
    border:1px solid var(--border);background:var(--superficie);color:var(--azul);
  }
  .btn:hover{background:var(--azul-suave)}

  /* ---- tabla (estilo .grilla de la App) ---- */
  .tablewrap{overflow-x:auto;background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radio)}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  th{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);
    font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;
    position:sticky;top:0;background:var(--fondo);z-index:1;
  }
  th:hover{color:var(--tinta)}
  th .ar{color:var(--azul);font-size:10px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-0)}
  td.obj{min-width:320px;color:var(--text-primary)}
  td.num,td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
  td.money{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  a{color:var(--azul-claro);text-decoration:none}
  a:hover{text-decoration:underline}
  td.obj a{font-weight:500}
  .org{color:var(--text-secondary);font-size:12.5px;margin-top:2px}

  /* ---- etiquetas de relevancia (escala de azul, siempre con texto) ---- */
  .b{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;color:var(--tinta)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .rel-alta{background:color-mix(in srgb,var(--rel-alta) 14%,transparent);border-color:color-mix(in srgb,var(--rel-alta) 42%,transparent)}
  .rel-alta .dot{background:var(--rel-alta)}
  .rel-media{background:color-mix(in srgb,var(--rel-media) 10%,transparent);border-color:color-mix(in srgb,var(--rel-media) 36%,transparent)}
  .rel-media .dot{background:var(--rel-media)}
  .rel-baja{background:var(--fondo);border-color:var(--linea-fuerte);color:var(--texto-2)}
  .rel-baja .dot{background:var(--rel-baja)}

  /* ---- plazo: naranja = cierra en 7 días, ámbar = en 15 (con el texto de días) ---- */
  .plazo{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
  .p-crit{color:var(--alerta);font-weight:700}
  .p-warn{color:var(--ambar-texto)}
  .p-ok{color:var(--text-secondary)}
  .p-past{color:var(--text-muted);font-weight:400}

  .est{display:inline-block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-2);background:var(--fondo-2);padding:2px 7px;border-radius:4px;white-space:nowrap}

  .msg{padding:34px 16px;text-align:center;color:var(--text-secondary);font-size:14px}
  .msg.err{color:var(--alerta)}
  .msg .det{color:var(--text-secondary);font-size:13px}
  footer{margin-top:20px;font-size:12px;color:var(--text-muted);line-height:1.7}
  footer code{font-size:11.5px;background:var(--surface-1);padding:1px 5px;border-radius:4px;border:1px solid var(--border-soft)}

  @media (max-width:640px){
    .wrap{padding:14px 12px 48px}
    h1{font-size:1.1rem}
    .barra .marca img{height:14px}
    .updated{font-size:11.5px;white-space:normal;text-align:right;max-width:92px;line-height:1.25}
    .tile .n{font-size:1.4rem}
  }
  .sinpres{color:var(--ambar-texto);font-size:.85em;font-style:italic;white-space:nowrap}
</style>
</head>
<body>
<header class="barra">
  <div class="marca"><button class="ig-volver" data-ig-volver aria-label="Volver a la App INGECO"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><img src="logo.png" alt="INGECO" data-ig-ocultar-en-app><h1>Licitaciones viales — NOA</h1></div>
  <div class="updated" id="updated"></div>
</header>
<div class="wrap">

  <p class="sub">
    Obras licitadas en Tucumán, Salta, Santiago del Estero, Catamarca y Jujuy, más las de
    Vialidad Nacional en la región. Se actualiza solo, de lunes a viernes.
  </p>

  <div class="tiles" id="tiles"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Buscar objeto, organismo, número…" aria-label="Buscar">
    <select id="f-prov" aria-label="Provincia"><option value="">Provincia: todas</option></select>
    <select id="f-rubro" aria-label="Rubro"><option value="">Rubro: todos</option></select>
    <select id="f-rel" aria-label="Relevancia"><option value="">Relevancia: toda</option></select>
    <select id="f-monto" aria-label="Monto mínimo">
      <option value="20000000">Desde $ 20 M</option>
      <option value="50000000">Desde $ 50 M</option>
      <option value="100000000">Desde $ 100 M</option>
      <option value="500000000">Desde $ 500 M</option>
      <option value="1000000000">Desde $ 1.000 M</option>
      <option value="0">Cualquier monto</option>
    </select>
    <select id="f-plazo" aria-label="Plazo">
      <option value="abiertas">Solo abiertas</option>
      <option value="">Todas</option>
      <option value="15">Cierran en 15 días</option>
      <option value="7">Cierran en 7 días</option>
    </select>
    <button class="btn" id="reset" type="button">Limpiar</button>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="fecha_apertura">Apertura <span class="ar"></span></th>
          <th data-k="_dias">Plazo <span class="ar"></span></th>
          <th data-k="objeto">Objeto / organismo <span class="ar"></span></th>
          <th data-k="provincia_obra">Provincia <span class="ar"></span></th>
          <th data-k="rubro">Rubro <span class="ar"></span></th>
          <th data-k="_pres">Presupuesto oficial <span class="ar"></span></th>
          <th data-k="_rel">Relevancia <span class="ar"></span></th>
          <th data-k="estado_seguimiento">Estado <span class="ar"></span></th>
        </tr>
      </thead>
      <tbody id="tb"><tr><td colspan="8"><div class="msg">Cargando…</div></td></tr></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* ------------------------------------------------------------------ config */
var API = "https://script.google.com/macros/s/AKfycbywxmntSoySlvqSpEIye9b4S1CXamxsQeq0BCCGQqyqJxS6J92FwTAsPzFZVJAkolYg/exec";

/* ------------------------------------------------------------------ estado */
var ROWS = [], VIEW = [], SORT = { k: "fecha_apertura", dir: 1 };

/* --------------------------------------------------------------- utilidades */
function txt(v){ return (v === null || v === undefined) ? "" : String(v).trim(); }
function esc(s){
  return txt(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function hoy(){ var d = new Date(); d.setHours(0,0,0,0); return d; }

/* Acepta ISO (2026-09-30), d/m/aaaa y Date(a,m,d) de gviz. */
function parseFecha(v){
  if (v instanceof Date) { var c = new Date(v); c.setHours(0,0,0,0); return c; }
  var s = txt(v); if (!s) return null;
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/Date\((\d+),(\d+),(\d+)/);
  if (m) return new Date(+m[1], +m[2], +m[3]);
  return null;
}
function fmtFecha(d){
  if (!d) return "—";
  var p = function(n){ return n < 10 ? "0"+n : ""+n; };
  return p(d.getDate()) + "/" + p(d.getMonth()+1) + "/" + d.getFullYear();
}
function dias(d){
  if (!d) return null;
  return Math.round((d - hoy()) / 86400000);
}
function numero(v){
  var s = txt(v); if (!s) return null;
  s = s.replace(/[^\d,.\-]/g, "");
  if (!s) return null;
  // formato argentino: 1.234.567,89
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(/,/g, "");
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmtMoneda(n, mon){
  if (n === null) return '<span class="sinpres" title="El organismo no publicó el presupuesto oficial">sin publicar</span>';
  var s = n.toLocaleString("es-AR", { maximumFractionDigits: 0 });
  var m = txt(mon).toUpperCase();
  var pre = (m === "USD" || m === "U$S") ? "US$ " : "$ ";
  return pre + s;
}
function relRank(r){
  r = txt(r).toLowerCase();
  return r === "alta" ? 3 : r === "media" ? 2 : r === "baja" ? 1 : 0;
}

/* ---------------------------------------------------------------- carga API */
/* La planilla es privada. La lee un Apps Script que corre como el dueño y la
   devuelve como JSON, asi que no depende de la sesion de Google del que mira
   ni de cookies de terceros (que los navegadores ya bloquean entre dominios). */
function cargar(){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if (ctl) ctl.abort(); }, 25000);
  fetch(API + "?datos=1&_=" + Date.now(), ctl ? { signal: ctl.signal } : {})
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(d){
      clearTimeout(t);
      if (!d || !d.ok) throw new Error((d && d.error) || "la API devolvio un error");
      if (d.faltan && d.faltan.length) {
        throw new Error("A la planilla le faltan columnas: " + d.faltan.join(", "));
      }
      ROWS = mapear(d.filas || []);
      init();
    })
    .catch(function(e){
      clearTimeout(t);
      fallo(e && e.name === "AbortError" ? new Error("La API no respondio a tiempo.") : e);
    });
}

function mapear(filas){
  var out = [];
  filas.forEach(function(f){
    var o = {};
    Object.keys(f || {}).forEach(function(k){
      o[txt(k).toLowerCase().replace(/\s+/g, "_")] = f[k];
    });
    // descarta la fila de inicializacion y las vacias
    if (txt(o.fuente).toLowerCase() === "inicializacion") return;
    if (!txt(o.objeto) && !txt(o.organismo)) return;
    o._fa   = parseFecha(o.fecha_apertura);
    o._dias = dias(o._fa);
    o._pres = numero(o.presupuesto_oficial);
    o._rel  = relRank(o.relevancia);
    out.push(o);
  });
  return out;
}

/* ------------------------------------------------------------------- filtros */
function opciones(sel, vals, etiqueta){
  var el = document.getElementById(sel);
  vals.filter(Boolean).sort(function(a,b){ return a.localeCompare(b, "es"); })
      .forEach(function(v){
        var o = document.createElement("option");
        o.value = v; o.textContent = v;
        el.appendChild(o);
      });
}
function unicos(k){
  var s = {}; ROWS.forEach(function(r){ var v = txt(r[k]); if (v) s[v] = 1; });
  return Object.keys(s);
}

function aplicar(){
  var q     = txt(document.getElementById("q").value).toLowerCase();
  var prov  = document.getElementById("f-prov").value;
  var rubro = document.getElementById("f-rubro").value;
  var rel   = document.getElementById("f-rel").value;
  var plazo = document.getElementById("f-plazo").value;
  var monto = Number(document.getElementById("f-monto").value) || 0;

  VIEW = ROWS.filter(function(r){
    if (!pasaMonto(r, monto)) return false;
    if (prov  && txt(r.provincia_obra) !== prov) return false;
    if (rubro && txt(r.rubro) !== rubro) return false;
    if (rel   && txt(r.relevancia).toLowerCase() !== rel.toLowerCase()) return false;
    if (plazo === "abiertas" && !abierta(r)) return false;
    if (plazo === "15" && !(r._dias !== null && r._dias >= 0 && r._dias <= 15)) return false;
    if (plazo === "7"  && !(r._dias !== null && r._dias >= 0 && r._dias <= 7))  return false;
    if (q) {
      var hay = [r.objeto, r.organismo, r.numero, r.notas, r.provincia_obra, r.rubro]
                .map(txt).join(" ").toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  ordenar();
  pintar();
  tiles();
}

function ordenar(){
  var k = SORT.k, dir = SORT.dir;
  VIEW.sort(function(a, b){
    var x = a[k], y = b[k];
    if (k === "fecha_apertura") { x = a._fa ? a._fa.getTime() : Infinity; y = b._fa ? b._fa.getTime() : Infinity; }
    if (x === null || x === undefined || x === "") x = (typeof y === "number") ? Infinity : "";
    if (y === null || y === undefined || y === "") y = (typeof x === "number") ? Infinity : "";
    if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
    return txt(x).localeCompare(txt(y), "es") * dir;
  });
}

/* -------------------------------------------------------------------- render */
function claseDias(d){
  if (d === null) return "p-ok";
  if (d < 0) return "p-past";
  if (d <= 7) return "p-crit";
  if (d <= 15) return "p-warn";
  return "p-ok";
}
function textoDias(d){
  if (d === null) return "—";
  if (d < 0) return "cerrada";
  if (d === 0) return "hoy";
  if (d === 1) return "1 día";
  return d + " días";
}

function pintar(){
  var tb = document.getElementById("tb");
  if (!VIEW.length) {
    tb.innerHTML = '<tr><td colspan="8"><div class="msg">Sin llamados que coincidan con el filtro.</div></td></tr>';
    return;
  }
  var html = VIEW.map(function(r){
    var rel = txt(r.relevancia).toLowerCase();
    var relCls = rel === "alta" ? "rel-alta" : rel === "media" ? "rel-media" : "rel-baja";
    var obj = esc(r.objeto) || "—";
    var url = txt(r.url);
    var objHtml = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + obj + '</a>' : obj;
    var org = [txt(r.organismo), txt(r.numero)].filter(Boolean).join(" · ");
    return '<tr>' +
      '<td class="date">' + fmtFecha(r._fa) + '</td>' +
      '<td class="num plazo ' + claseDias(r._dias) + '">' + textoDias(r._dias) + '</td>' +
      '<td class="obj">' + objHtml + (org ? '<div class="org">' + esc(org) + '</div>' : '') + '</td>' +
      '<td>' + (esc(r.provincia_obra) || "—") + '</td>' +
      '<td>' + (esc(r.rubro) || "—") + '</td>' +
      '<td class="money">' + fmtMoneda(r._pres, r.moneda) + '</td>' +
      '<td>' + (rel ? '<span class="b ' + relCls + '"><span class="dot"></span>' + esc(r.relevancia) + '</span>' : "—") + '</td>' +
      '<td>' + (txt(r.estado_seguimiento) ? '<span class="est">' + esc(r.estado_seguimiento) + '</span>' : "—") + '</td>' +
    '</tr>';
  }).join("");
  tb.innerHTML = html;
}

// Abierta = apertura futura o sin fecha, salvo que el estado (editado a mano en la
// planilla) diga descartado / cerrado / adjudicado / vencido.
function abierta(r){
  var e = txt(r.estado_seguimiento).toLowerCase();
  if (/^(descart|cerr|adjudic|venc)/.test(e)) return false;
  return r._dias === null || r._dias >= 0;
}
// Un llamado pasa el filtro de monto si su presupuesto llega al mínimo o si no
// tiene presupuesto publicado (no se descarta lo que no se conoce).
function pasaMonto(r, min){
  if (!min) return true;
  return r._pres === null || r._pres >= min;
}
function tiles(){
  var min = Number(document.getElementById("f-monto").value) || 0;
  var base = ROWS.filter(function(r){ return pasaMonto(r, min); });
  var abiertas = base.filter(abierta);
  var d15 = abiertas.filter(function(r){ return r._dias !== null && r._dias <= 15; });
  var alta = abiertas.filter(function(r){ return relRank(r.relevancia) === 3; });
  var nuevas = base.filter(function(r){
    return txt(r.estado_seguimiento).toLowerCase() === "nuevo" && abierta(r);
  });
  var t = [
    { n: abiertas.length, l: "Llamados abiertos" },
    { n: d15.length,      l: "Cierran en 15 días", cls: d15.length ? "urgente" : "" },
    { n: alta.length,     l: "Relevancia alta" },
    { n: nuevas.length,   l: "Sin revisar" },
    { n: VIEW.length,     l: "En la vista actual" }
  ];
  document.getElementById("tiles").innerHTML = t.map(function(x){
    return '<div class="tile ' + (x.cls || "") + '"><div class="n">' + x.n + '</div><div class="l">' + x.l + '</div></div>';
  }).join("");
}

/* ---------------------------------------------------------------------- init */
function init(){
  opciones("f-prov",  unicos("provincia_obra"));
  opciones("f-rubro", unicos("rubro"));
  ["alta","media","baja"].forEach(function(v){
    var o = document.createElement("option"); o.value = v; o.textContent = v;
    document.getElementById("f-rel").appendChild(o);
  });

  ["q","f-prov","f-rubro","f-rel","f-plazo","f-monto"].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener(id === "q" ? "input" : "change", aplicar);
  });
  document.getElementById("reset").addEventListener("click", function(){
    document.getElementById("q").value = "";
    ["f-prov","f-rubro","f-rel"].forEach(function(i){ document.getElementById(i).value = ""; });
    document.getElementById("f-plazo").value = "abiertas";
    document.getElementById("f-monto").value = "20000000";
    aplicar();
  });

  document.querySelectorAll("th[data-k]").forEach(function(th){
    th.addEventListener("click", function(){
      var k = th.getAttribute("data-k");
      SORT.dir = (SORT.k === k) ? -SORT.dir : 1;
      SORT.k = k;
      document.querySelectorAll("th .ar").forEach(function(a){ a.textContent = ""; });
      th.querySelector(".ar").textContent = SORT.dir > 0 ? "▲" : "▼";
      ordenar(); pintar();
    });
  });

  var d = new Date();
  document.getElementById("updated").textContent =
    "Datos leídos " + fmtFecha(d) + " " +
    (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" +
    (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();

  document.getElementById("foot").innerHTML =
    "Fuente: boletines oficiales de la Nación y de las provincias del NOA. " +
    "El seguimiento lo actualiza una tarea automática de lunes a viernes; la columna " +
    "<code>estado_seguimiento</code> se edita a mano en la planilla. " +
    "Solo ejecución de obra: no se cargan compras de bienes ni alquileres de equipos. Los llamados con presupuesto menor a $ 20 M tampoco; los que no publican monto se muestran igual (\"sin publicar\").";

  document.getElementById("f-plazo").value = "abiertas";
  document.getElementById("f-monto").value = "20000000";
  aplicar();
}

function fallo(e){
  document.getElementById("tb").innerHTML =
    '<tr><td colspan="8"><div class="msg err">No se pudieron leer los datos.<br><br>' +
    '<span class="det">' + esc(e.message) + '<br>' +
    'Probá recargar en un rato. Si sigue, la API de la planilla (Apps Script) está caída o cambió de URL.' +
    '</span></div></td></tr>';
  document.getElementById("tiles").innerHTML = "";
}

cargar();
</script>
</body>
</html>
